name: Build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true Pokemon Bond of Eire

on:
  push:
    branches: [ clean-bedroom-state ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3
      - name: Build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true ROM
        run: make -j2
      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon_Bond_of_Eire
          path: pokeemerald.gba
