name: Build

on:
  push:
    branches: [ clean-bedroom-state, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create ccache directory
        run: mkdir -p ~/.ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3 ccache

      - name: Build
        run: make -j$(nproc) CCACHE=1

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon_Bond_of_Eire
          path: pokeemerald.gba
# Force Trigger
