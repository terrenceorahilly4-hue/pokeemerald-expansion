name: Build Pokemon Bond of Eire

on:
  push:
    branches: [ clean-bedroom-state ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi libpng-dev

      - name: Build tools
        run: make tools

      - name: Build ROM
        run: make -j$(nproc)

      - name: Upload ROM
        uses: actions/upload-artifact@v4
        with:
          name: Pokemon-Bond-of-Eire
          path: pokeemerald.gba
