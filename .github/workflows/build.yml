name: Build Bond of Éire

on:
  push:
    branches: [ echo-bond-foundation ]
  pull_request:
    branches: [ echo-bond-foundation ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Install ARM Embedded Toolchain
        uses: gnu-mcu-eclipse/setup-arm-embedded-gcc-action@v11
        with:
          version: '10.3-2021.10'

      - name: Install Native Compilation Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpng-dev

      - name: PRE-CHECK 1: Validate Map & Layout JSON Integrity
        run: |
          make clean
          make json

      - name: PRE-CHECK 2: Execute Custom Intro & NPC Object Validation
        run: |
          if [ -f tools/intro_validator.py ]; then
            python3 tools/intro_validator.py
          elif [ -f tools/validate_intro.py ]; then
            python3 tools/validate_intro.py
          else
            echo "Intro validator script not found, skipping."
          fi

      - name: PRE-CHECK 3: Scan Codebase Natively for Unbalanced Quotes
        run: |
          python3 -c '
          import glob
          files = glob.glob("data/maps/*/*.inc") + glob.glob("data/scripts/*.inc") + ["data/event_scripts.s"]
          failed = False
          for fpath in files:
              try:
                  with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                      for i, line in enumerate(f, 1):
                          if line.count("\"") % 2 != 0:
                              print(f"❌ Unbalanced Quote: {fpath} line {i}: {line.strip()}")
                              failed = True
              except: pass
          if failed: exit(1)
          print("✓ All quotes perfectly balanced.")
          '

      - name: PRODUCTION ROM COMPILATION
        run: |
          make -j$(nproc)
